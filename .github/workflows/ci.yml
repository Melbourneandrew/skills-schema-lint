name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed bundles are reproducible
        run: git diff --exit-code -- dist
      - name: Benchmark
        if: runner.os == 'Linux'
        run: npm run bench
  action:
    name: Action (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate without install or setup
        id: valid
        uses: ./
        with:
          paths: test/fixtures/valid
          profile: spec
      - name: Invalid skills must fail
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          paths: test/fixtures/invalid
      - name: Verify action outcomes and outputs
        env:
          VALID_COUNT: ${{ steps.valid.outputs.skills-checked }}
          VALID_ERRORS: ${{ steps.valid.outputs.errors }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          INVALID_ERRORS: ${{ steps.invalid.outputs.errors }}
        run: node scripts/verify-action.mjs
